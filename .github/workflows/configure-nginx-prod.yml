name: Configure Nginx and Certbot for Production

on:
  push:
    branches:
      - main
    paths:
      - 'nginx/**'
  workflow_dispatch:
    inputs:
      force:
        description: "Run although production already has a certificate (replaces the live vhost; read docs before ticking)"
        type: boolean
        default: false

# Top level rather than on the job: the controls test (T1) forbids job-level permissions, and
# this workflow has one job, so id-token: write reaches the configure job only.
permissions:
  contents: read
  id-token: write

jobs:
  configure-nginx:
    runs-on: ubuntu-latest
    # Same production credentials and SSH access as deploy-prod.yml, so the same
    # environment gate (secrets, branch policy, required reviewers) must apply.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Configure AWS credentials (OIDC)
        # Same role as deploy-prod.yml: short-lived credentials from the job's OIDC token,
        # trusted for this repository's `production` environment only. No static key here.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::280648354859:role/github-actions-prod-erp-role
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Retrieve secrets from AWS Secrets Manager
        run: |
          .github/scripts/fetch-aws-secrets.sh \
            "${{ secrets.PROD_AWS_DEPLOY_SECRET_ID }}" \
            "${{ github.workspace }}/secrets.env"

      - name: Allow this runner to reach SSH (VC-647)
        # SSH is restricted at the Lightsail firewall to approved addresses. Grant this
        # runner's /32 for the duration of the run; it is revoked in the last step.
        # A failure here is shown but not fatal: "Test SSH connection" is the real check.
        continue-on-error: true
        run: |
          # Read only the two values the script needs. Sourcing secrets.env would replace the
          # OIDC role's access key id and secret key with the key pair stored in the
          # deploy secret while AWS_SESSION_TOKEN stays set, and every AWS call would then fail.
          secrets_file="${{ github.workspace }}/secrets.env"
          lightsail_host=$(sed -n 's/^lightsail_host=//p' "$secrets_file")
          LIGHTSAIL_INSTANCE_NAME=$(sed -n 's/^LIGHTSAIL_INSTANCE_NAME=//p' "$secrets_file")
          .github/scripts/lightsail-ssh-access.sh open \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Setup SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/setup-ssh.sh \
            "$lightsail_private_key_b64" \
            "$lightsail_host" \
            "$lightsail_user" \
            "${lightsail_port:-22}"

      - name: Test SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/test-ssh-connection.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Refuse to touch a host that already has a certificate unless forced
        # Fail closed: this workflow replaces the live vhost. On a host that already serves
        # TLS, that must be a deliberate, reviewed run (dispatch with force), never a side
        # effect of a push to nginx/** or an unticked dispatch.
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          source ${{ github.workspace }}/secrets.env
          if ssh -i ~/.ssh/lightsail_key -p "${lightsail_port:-22}" -o StrictHostKeyChecking=accept-new \
              "$lightsail_user@$lightsail_host" \
              "sudo test -e /etc/letsencrypt/live/$CERTBOT_DOMAIN/fullchain.pem"; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::A certificate already exists for this domain; continuing because force is set"
            else
              echo "::error::A certificate already exists for this domain. Re-run with force only after reviewing the rendered vhost."
              exit 1
            fi
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::Could not check for an existing certificate (ssh exit $rc); refusing to continue"
              exit 1
            fi
            echo "No certificate on the host yet; continuing"
          fi

      - name: Generate Nginx configuration
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/render-nginx-conf.sh \
            "$CERTBOT_DOMAIN" \
            "${{ github.workspace }}/nginx.conf"

      - name: Setup SSL certificate
        # Before Configure Nginx: the vhost it installs references this certificate (VC-652).
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/setup-certbot.sh \
            "$CERTBOT_DOMAIN" \
            "$CERTBOT_EMAIL" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Configure Nginx
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/configure-nginx.sh \
            "$SITE_NAME" \
            "$CERTBOT_DOMAIN" \
            "${{ github.workspace }}/nginx.conf" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Get certificate details
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          ssh -i ~/.ssh/lightsail_key -p "${lightsail_port:-22}" -o StrictHostKeyChecking=accept-new \
            "$lightsail_user@$lightsail_host" \
            "sudo certbot certificates" > certificate_details.txt 2>&1 || true

      - name: Get nginx status
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          ssh -i ~/.ssh/lightsail_key -p "${lightsail_port:-22}" -o StrictHostKeyChecking=accept-new \
            "$lightsail_user@$lightsail_host" \
            "sudo systemctl status nginx --no-pager -l" > nginx_status.txt 2>&1 || true

      - name: Create configuration summary
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          {
            echo "## Nginx and SSL Configuration Summary"
            echo ""
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ **Status**: Configuration completed successfully"
            else
              echo "❌ **Status**: Configuration failed"
            fi
            echo ""
            echo "### Site Details"
            echo "- **Site Name**: $SITE_NAME"
            echo "- **Domain**: $CERTBOT_DOMAIN"
            echo "- **Secure URL**: https://$CERTBOT_DOMAIN"
            echo ""
            echo "### Nginx Status"
            echo '```'
            cat nginx_status.txt 2>/dev/null || echo "Unable to retrieve nginx status"
            echo '```'
            echo ""
            echo "### SSL Certificate Details"
            echo '```'
            cat certificate_details.txt 2>/dev/null || echo "Unable to retrieve certificate details"
            echo '```'
            echo ""
            echo "### Configuration Time"
            echo "- $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke this runner's SSH access (VC-647)
        # Not continue-on-error: a runner address left on the SSH rule must turn the run
        # red, not hide behind a green deploy.
        if: always() && env.VC647_RUNNER_CIDR != ''
        run: |
          # secrets.env still exists here (Cleanup runs after this step). Read the host and
          # instance name from it rather than from exported variables: VC-649 removed the
          # step that exported them, and the revoke then ran with empty values and left the
          # runner's /32 on the SSH rule.
          # Read only the two values the script needs. Sourcing secrets.env would replace the
          # OIDC role's access key id and secret key with the key pair stored in the
          # deploy secret while AWS_SESSION_TOKEN stays set, and every AWS call would then fail.
          secrets_file="${{ github.workspace }}/secrets.env"
          if [ -f "$secrets_file" ]; then
            lightsail_host=$(sed -n 's/^lightsail_host=//p' "$secrets_file")
            LIGHTSAIL_INSTANCE_NAME=$(sed -n 's/^LIGHTSAIL_INSTANCE_NAME=//p' "$secrets_file")
          fi
          .github/scripts/lightsail-ssh-access.sh close \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Cleanup
        if: always()
        run: |
          rm -f ${{ github.workspace }}/secrets.env
          rm -f ${{ github.workspace }}/nginx.conf
          rm -f certificate_details.txt
          rm -f nginx_status.txt

