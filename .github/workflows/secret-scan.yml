name: Secret scan

# VC-657. Scans the commits a PR or push introduces for committed credentials, with gitleaks.
#
# This repository is public and so are its Actions logs. The job therefore:
#   * runs gitleaks with --redact, so a finding names the file, line and rule, never the value;
#   * uploads no report artifact;
#   * holds no secrets and only a read-only GITHUB_TOKEN;
#   * installs a pinned gitleaks release verified by sha256, not gitleaks-action (which needs a
#     paid licence for organisation repos) or a floating "latest".
#
# Deliberately no `paths:` filter, so it can be made a required check (a path-skipped required
# check leaves the PR stuck on "Expected").
on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the base of the range and the merge-base fallback resolve.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          workdir="$(mktemp -d)"
          curl -sSfL -o "$workdir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          (cd "$workdir" && echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -)
          tar -xzf "$workdir/$tarball" -C "$workdir" gitleaks
          sudo install -m 0755 "$workdir/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the introduced commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            # A new branch has no "before". Scan what it adds over the default branch; if it IS
            # the default branch (or adds nothing), scan its tip commit.
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
            if [ "$base" != "$(git rev-parse HEAD)" ]; then
              RANGE="${base}..HEAD"
            elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="HEAD"
            fi
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks git --redact --verbose --no-banner --exit-code 1 --log-opts="$RANGE"
