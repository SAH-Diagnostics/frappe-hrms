name: Deploy to Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      allow_dirty:
        description: "Discard on-box edits that differ from the target commit (review the diff from the failed run first)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Binds the job to the GitHub environment so environment-scoped secrets, the
    # deployment branch policy and required reviewers apply once they are configured.
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Setup AWS CLI
        run: |
          .github/scripts/setup-aws-cli.sh \
            "${{ secrets.DEV_AWS_ACCESS_KEY_ID }}" \
            "${{ secrets.DEV_AWS_SECRETS_ACCESS_KEY }}" \
            "${{ secrets.AWS_SECRETS_REGION }}"

      - name: Retrieve secrets from AWS Secrets Manager
        run: |
          .github/scripts/fetch-aws-secrets.sh \
            "${{ secrets.DEV_AWS_DEPLOY_SECRET_ID }}" \
            "${{ github.workspace }}/secrets.env"

      - name: Generate environment file
        run: |
          .github/scripts/generate-env-file.sh \
            "${{ github.workspace }}/secrets.env" \
            "${{ github.workspace }}/.env"

      - name: Allow this runner to reach SSH (VC-647)
        # SSH is restricted at the Lightsail firewall to approved addresses. Grant this
        # runner's /32 for the duration of the run; it is revoked in the last step.
        # A failure here is shown but not fatal: "Test SSH connection" is the real check.
        continue-on-error: true
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/lightsail-ssh-access.sh open \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Setup SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/setup-ssh.sh \
            "$lightsail_private_key_b64" \
            "$lightsail_host" \
            "$lightsail_user" \
            "${lightsail_port:-22}"

      - name: Test SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/test-ssh-connection.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Install Docker dependencies
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/install-docker-dependencies.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Configure host firewall (VC-647)
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/configure-host-firewall.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Transfer environment file
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/copy-file-to-instance.sh \
            "${{ github.workspace }}/.env" \
            "/home/$lightsail_user/.env" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Deploy application
        id: deploy
        run: |
          source ${{ github.workspace }}/secrets.env
          # Verify the public URL, so a green job means the site actually served a
          # request through nginx -- not merely that containers started. Empty when
          # CERTBOT_DOMAIN is unset, in which case the script falls back to localhost.
          export HEALTHCHECK_URL="${CERTBOT_DOMAIN:+https://$CERTBOT_DOMAIN}"
          # Only ever true on a manual re-run where someone reviewed the printed diff.
          export ALLOW_DIRTY="${{ inputs.allow_dirty || false }}"
          export HEALTHCHECK_TIMEOUT="${HEALTHCHECK_TIMEOUT:-900}"
          .github/scripts/deploy-docker-app.sh \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "/opt/app" \
            "/home/$lightsail_user/.env" \
            "docker/docker-compose.yml" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}" \
            "develop"

      - name: Get container status
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          ssh -i ~/.ssh/lightsail_key -p "${lightsail_port:-22}" -o StrictHostKeyChecking=accept-new \
            "$lightsail_user@$lightsail_host" \
            "cd /opt/app && sudo docker compose ps" > container_status.txt || true

      - name: Create deployment summary
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          {
            echo "## Deployment Summary"
            echo ""
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ **Status**: Deployment completed successfully"
            else
              echo "❌ **Status**: Deployment failed"
            fi
            echo ""
            echo "### Application Details"
            echo "- **Site URL**: https://$CERTBOT_DOMAIN"
            echo "- **Site Name**: $SITE_NAME"
            echo "- **Backup Schedule**: Every ${FILES_BACK_UP_HOURS:-24} hours"
            echo ""
            echo "### Container Status"
            echo '```'
            cat container_status.txt 2>/dev/null || echo "Unable to retrieve container status"
            echo '```'
            echo ""
            echo "### Deployment Time"
            echo "- $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke this runner's SSH access (VC-647)
        if: always() && env.VC647_RUNNER_CIDR != ''
        continue-on-error: true
        run: |
          .github/scripts/lightsail-ssh-access.sh close \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ${{ github.workspace }}/secrets.env
          rm -f ${{ github.workspace }}/.env
          rm -f container_status.txt

