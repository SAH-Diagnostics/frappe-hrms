name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_dirty:
        description: "Discard on-box edits that differ from the target commit (review the diff from the failed run first)"
        type: boolean
        default: false

# Top level rather than on the job: the controls test (T1) forbids job-level permissions, and
# T2 holds this workflow to one job, so this grants id-token: write to the deploy job only.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Merging to main fires this workflow with no human step, so a merge and a production
    # deploy are currently the same action. Naming an Environment lets required reviewers
    # be attached in Settings -> Environments -> production; until they are configured
    # there this key changes nothing, so adding it is safe on its own.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Configure AWS credentials (OIDC)
        # Short-lived credentials from the GitHub OIDC token; no static key is held here.
        # The role trusts this repository's `production` environment only (DEPLOYMENT_CONTROLS.md §8).
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::280648354859:role/github-actions-prod-erp-role
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Retrieve secrets from AWS Secrets Manager
        run: |
          .github/scripts/fetch-aws-secrets.sh \
            "${{ secrets.PROD_AWS_DEPLOY_SECRET_ID }}" \
            "${{ github.workspace }}/secrets.env"

      - name: Generate environment file
        run: |
          .github/scripts/generate-env-file.sh \
            "${{ github.workspace }}/secrets.env" \
            "${{ github.workspace }}/.env"
          # Per-environment by design (VC-655): the workflow, not the promoted init.sh, picks
          # the sah_crm branch, so a staging -> main promotion cannot carry staging's value.
          echo "SAH_CRM_BRANCH=main" >> "${{ github.workspace }}/.env"

      - name: Allow this runner to reach SSH (VC-647)
        # SSH is restricted at the Lightsail firewall to approved addresses. Grant this
        # runner's /32 for the duration of the run; it is revoked in the last step.
        # A failure here is shown but not fatal: "Test SSH connection" is the real check.
        continue-on-error: true
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/lightsail-ssh-access.sh open \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Setup SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/setup-ssh.sh \
            "$lightsail_private_key_b64" \
            "$lightsail_host" \
            "$lightsail_user" \
            "${lightsail_port:-22}"

      - name: Test SSH connection
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/test-ssh-connection.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Install Docker dependencies
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/install-docker-dependencies.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Configure host firewall (VC-647)
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/configure-host-firewall.sh \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Transfer environment file
        run: |
          source ${{ github.workspace }}/secrets.env
          .github/scripts/copy-file-to-instance.sh \
            "${{ github.workspace }}/.env" \
            "/home/$lightsail_user/.env" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}"

      - name: Deploy application
        id: deploy
        run: |
          source ${{ github.workspace }}/secrets.env
          # Verify the public URL, so a green job means the site actually served a
          # request through nginx -- not merely that containers started. Empty when
          # CERTBOT_DOMAIN is unset, in which case the script falls back to localhost.
          export HEALTHCHECK_URL="${CERTBOT_DOMAIN:+https://$CERTBOT_DOMAIN}"
          # Only ever true on a manual re-run where someone reviewed the full diff on the box.
          export ALLOW_DIRTY="${{ inputs.allow_dirty || false }}"
          export HEALTHCHECK_TIMEOUT="${HEALTHCHECK_TIMEOUT:-900}"
          .github/scripts/deploy-docker-app.sh \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "/opt/app" \
            "/home/$lightsail_user/.env" \
            "docker/docker-compose.yml" \
            "$lightsail_user" \
            "$lightsail_host" \
            "${lightsail_port:-22}" \
            "main"

      - name: Get container status
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          ssh -i ~/.ssh/lightsail_key -p "${lightsail_port:-22}" -o StrictHostKeyChecking=accept-new \
            "$lightsail_user@$lightsail_host" \
            "cd /opt/app && sudo docker compose ps" > container_status.txt || true

      - name: Create deployment summary
        if: always()
        run: |
          source ${{ github.workspace }}/secrets.env
          {
            echo "## Deployment Summary"
            echo ""
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ **Status**: Deployment completed successfully"
            else
              echo "❌ **Status**: Deployment failed"
            fi
            echo ""
            echo "### Application Details"
            echo "- **Site URL**: https://$CERTBOT_DOMAIN"
            echo "- **Site Name**: $SITE_NAME"
            echo "- **Files backup schedule** (deploy secret; verify-site.sh checks the job is installed on the box): FILES_BACK_UP_HOURS=${FILES_BACK_UP_HOURS:-1}"
            echo ""
            echo "### Container Status"
            echo '```'
            cat container_status.txt 2>/dev/null || echo "Unable to retrieve container status"
            echo '```'
            echo ""
            echo "### Deployment Time"
            echo "- $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AWS credentials for the revoke (OIDC)
        # The OIDC session lasts one hour; assume the role again so a long deploy cannot
        # leave the revoke below without credentials and the runner's /32 on the SSH rule.
        if: always() && env.VC647_RUNNER_CIDR != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::280648354859:role/github-actions-prod-erp-role
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Revoke this runner's SSH access (VC-647)
        # Not continue-on-error: a runner address left on the SSH rule must turn the run
        # red, not hide behind a green deploy.
        if: always() && env.VC647_RUNNER_CIDR != ''
        run: |
          # secrets.env still exists here (Cleanup runs after this step). Read the host and
          # instance name from it rather than from exported variables: VC-649 removed the
          # step that exported them, and the revoke then ran with empty values and left the
          # runner's /32 on the SSH rule.
          if [ -f ${{ github.workspace }}/secrets.env ]; then source ${{ github.workspace }}/secrets.env; fi
          .github/scripts/lightsail-ssh-access.sh close \
            "$lightsail_host" \
            "${LIGHTSAIL_INSTANCE_NAME:-}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ${{ github.workspace }}/secrets.env
          rm -f ${{ github.workspace }}/.env
          rm -f container_status.txt

