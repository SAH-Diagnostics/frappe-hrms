# version: "3.8" # Removed - obsolete in Docker Compose v2
services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — copy docker/.env.example to docker/.env for local dev}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    # Pinned for RECORDABILITY, not to change behaviour: `redis:alpine` and `8.10.2-alpine`
    # resolve to the same digest today (sha256:2d3814be...), so this is a no-op at deploy time.
    # `alpine` is a moving tag -- it was pushed 2026-09-21 and will move again -- which means the
    # running Redis version cannot be *recorded*, and an unrecordable version cannot be evidenced
    # against a 14-day patch standard. Bump this deliberately; see
    # helper/docs/erp-patch-and-dependency-process.md (SAH-root helper/, not in this repo).
    image: redis:8.10.2-alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:v5.31.0@sha256:6968600ad6524a150ee6cf2e1e58faa93932000565946abf1795c7f268751409
    restart: unless-stopped
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      # Database configuration - use external RDS if provided, otherwise local MariaDB
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set — copy docker/.env.example to docker/.env for local dev}
      - DB_NAME=${DB_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set — copy docker/.env.example to docker/.env for local dev}
      # Frappe's encryption_key, pinned so stored secrets survive a rebuilt container (docker/init.sh)
      - ENCRYPTION_KEY=${FRAPPE_ENCRYPTION_KEY:?FRAPPE_ENCRYPTION_KEY must be set — copy docker/.env.example to docker/.env for local dev}
      # Support alternative RDS variable names (for compatibility with deployment scripts)
      - RDS_HOSTNAME=${RDS_HOSTNAME:-${DB_HOST:-}}
      - RDS_PORT=${RDS_PORT:-${DB_PORT:-3306}}
      - RDS_USERNAME=${RDS_USERNAME:-${DB_USER:-root}}
      - RDS_PASSWORD=${RDS_PASSWORD:-${DB_PASSWORD}}
      - RDS_DB_NAME=${RDS_DB_NAME:-${DB_NAME:-}}
      # Developer mode must stay OFF in staging/production; only local dev opts in via docker/.env
      - DEVELOPER_MODE=${DEVELOPER_MODE:-0}
      # sah_crm branch to clone; each deploy workflow sets it for its own environment
      - SAH_CRM_BRANCH=${SAH_CRM_BRANCH:-main}
      # Site name configuration
      - SITE_NAME=${SITE_NAME:-hrms.localhost}
      # Public site URL used for absolute links (emails, password reset, etc.)
      - SITE_URL=${SITE_URL:-}
      # Safety flag to prevent overwriting existing sites
      - EXISTING_SITE=${EXISTING_SITE:-false}
      # S3 backup configuration
      - BUCKET_NAME=${BUCKET_NAME:-}
      - BUCKET_ACCESS_KEY_ID=${BUCKET_ACCESS_KEY_ID:-}
      - BUCKET_SECRET_ACCESS_KEY=${BUCKET_SECRET_ACCESS_KEY:-}
      - BUCKET_REGION=${BUCKET_REGION:-eu-west-2}
      - BUCKET_ENDPOINT=${BUCKET_ENDPOINT:-}
      - FILES_BACK_UP_HOURS=${FILES_BACK_UP_HOURS:-}
      # Two-factor authentication policy (docker/configure_2fa.py); defaults enforce OTP-app 2FA for all users
      - FRAPPE_2FA_ENABLED=${FRAPPE_2FA_ENABLED:-1}
      - FRAPPE_2FA_ROLES=${FRAPPE_2FA_ROLES:-All}
      - FRAPPE_2FA_ISSUER=${FRAPPE_2FA_ISSUER:-SAH ERP}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      # sites/<site> (uploaded files, site_config.json) lives here so a deploy's
      # `compose down` does not discard it; init.sh links it into the bench.
      - frappe-site-data:/home/frappe/site-data
    ports:
      # Loopback only (VC-647). nginx on the host proxies 80/443 to these two ports.
      # Publishing them on 0.0.0.0 lets Docker route internet traffic straight to the
      # container, bypassing both nginx and the host firewall (ufw never sees it).
      - 127.0.0.1:8000:8000
      - 127.0.0.1:9000:9000
    depends_on:
      - redis
      - mariadb

volumes:
  mariadb-data:
  frappe-site-data: